services:
  - type: web
    name: manoir-kits-private
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
