name: Log deployment effort

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      since_sha:
        description: Commit after which missing main-branch work should be backfilled
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: support-tracker-main
  cancel-in-progress: false

jobs:
  log-deployment:
    name: Estimate and log main push
    runs-on: ubuntu-latest
    steps:
      - name: Read deployment changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add deployment to owner dashboard
        if: github.event_name == 'push'
        env:
          DEPLOYMENT_TRACKER_ENDPOINT: https://us-west1-manoir-kits.cloudfunctions.net/logDeployment
          DEPLOYMENT_TRACKER_SECRET: ${{ secrets.DEPLOYMENT_TRACKER_SECRET }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/log-deployment.mjs

      - name: Backfill missing deployments
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOYMENT_TRACKER_ENDPOINT: https://us-west1-manoir-kits.cloudfunctions.net/logDeployment
          DEPLOYMENT_TRACKER_SECRET: ${{ secrets.DEPLOYMENT_TRACKER_SECRET }}
          SUPPORT_BACKFILL_SINCE: ${{ inputs.since_sha }}
        run: node scripts/backfill-deployments.mjs
