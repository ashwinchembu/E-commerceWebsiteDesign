
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>E-commerce Website Design</title>
      <meta name="description" content="Discover and shop exclusive streetwear brands with free shipping on orders over $200, while staying updated on the latest drops and promotions." />
      <meta name="robots" content="noindex, nofollow" />
      <!-- Start the jacket's small model and decoder downloads before React
           mounts. They stay invisible and are reused when the builder opens. -->
      <link rel="preload" href="/models/varsitybase/VarsityBase.glb" as="fetch" crossorigin="anonymous" />
      <link rel="preload" href="/draco/draco_wasm_wrapper.js" as="fetch" crossorigin="anonymous" />
      <link rel="preload" href="/draco/draco_decoder.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
