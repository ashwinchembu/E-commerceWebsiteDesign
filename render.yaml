services:
  - type: web
    name: ecommerce-website-design
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_FUNCTIONS_REGION
        value: us-west1
      - key: VITE_FIREBASE_APPCHECK_SITE_KEY
        sync: false
      - key: VITE_SHOPIFY_STORE_DOMAIN
        sync: false
      - key: VITE_SHOPIFY_API_VERSION
        value: "2026-07"
      - key: VITE_SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID
        sync: false
      - key: VITE_SHOPIFY_FOOTBALLER_TAGS
        value: footballer,owner
      - key: VITE_SHOPIFY_JACKET_VARIANTS
        sync: false
