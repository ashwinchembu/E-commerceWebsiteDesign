services:
  - type: web
    name: manoir-kits-private
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: VITE_PRIVATE_ACCESS_ENABLED
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: ACCESS_EVENT_RETENTION_DAYS
        value: "30"
      - key: ACCESS_ADMIN_SECRET
        sync: false
      - key: ACCESS_SESSION_SECRET
        generateValue: true
      - key: MONGODB_DATABASE
        value: manoir_kits_access
      - key: MONGODB_URI
        sync: false
